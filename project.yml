name: TrackerBet
options:
  bundleIdPrefix: com.YvianDorel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "8"
    PRODUCT_BUNDLE_IDENTIFIER: com.YvianDorel.TrackerFootballBett
    DEVELOPMENT_TEAM: "9D3BPD28N7"
    CODE_SIGN_STYLE: Automatic
targets:
  TrackerBet:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
        excludes:
          - Info.plist
      - path: Assets.xcassets
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: "IconResources/AppIcon60x60@2x.png"
        buildPhase: resources
      - path: "IconResources/AppIcon60x60@3x.png"
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.YvianDorel.TrackerFootballBett
        PRODUCT_DISPLAY_NAME: Match Journal
        CODE_SIGN_ENTITLEMENTS: Config/TrackerFootballBett.entitlements
        DEVELOPMENT_TEAM: "9D3BPD28N7"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "8"
        MARKETING_VERSION: "1.0.0"
schemes:
  TrackerBet:
    build:
      targets:
        TrackerBet: all
